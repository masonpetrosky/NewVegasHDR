; NewVegasHDR settings. Changes are picked up while the game runs (within a second of saving), except the three
; marked "restart".

[HDR]
; 1 = HDR output when Windows HDR is on for the game's display and DXVK is the game's d3d9.dll; 0 = off (restart).
Enabled=1
; The brightest the display can show, in nits. 0 = what Windows reports for the display.
PeakNits=0
; How bright white is, in nits: the HUD, menus and everything that was white in SDR. 203 is the HDR reference white.
PaperWhiteNits=203
; The look in HDR. Vanilla: the game's own, which has no curve; in HDR nothing is cut off at white, so whatever the
; game's lighting makes brighter than white shows brighter. VanillaPlus: Vanilla Plus Tonemapper's curve, made for SDR,
; which squeezes highlights to keep them under white (softer, more muted highlights; see HighlightRange). Auto: the
; curve of the shaders the game loaded. SDR output always keeps the loaded shaders' own look.
ToneMapper=Vanilla
; How much of the display's range Vanilla Plus Tonemapper's curve may use in HDR, 0 to 1 (with ToneMapper=VanillaPlus,
; or Auto with it installed). That curve squeezes nearly everything under white, so with 0 (as in SDR) HDR adds
; little more than its brightest lights. 1 lets skies, sunlit ground and lights use the display's range, while
; shadows and mid-tones stay as they were.
HighlightRange=1
; Highlights above this fraction of the peak roll off smoothly towards the peak (0.1 to 0.95).
ShoulderStart=0.5
; The gamma the game's image is decoded with. 2.2 matches a typical SDR monitor.
Gamma=2.2

[Advanced]
; Swap in the HDR versions of the game's tonemapping shaders (restart).
ReplaceShaders=1
; Create the full-screen 8-bit render targets after the tonemapper as 16-bit float, so highlights survive them (restart).
UpgradeRenderTargets=1
; 1 = reproduce the SDR image exactly, still sent as HDR: for comparing against the game without the plugin.
SdrExact=0
; 1 = HDR output even when Windows reports HDR off for the display (testing only).
ForceHdr=0
